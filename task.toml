schema_version = "1.1"

[task]
name = "talents/flux-safe-migration"
description = "Repair historical fair-share migration, idempotent retry, schema fidelity, and failure recovery in an offline Flux accounting SQLite upgrader."
authors = []
keywords = ["python", "hpc", "flux", "sqlite", "migration", "recovery"]

[metadata]
difficulty = "expert"
category = "systems"
tags = ["debugging", "database", "hpc", "transactions", "offline"]
expert_time_estimate_min = 150.0
junior_time_estimate_min = 360.0
difficulty_explanation = """
For a human database or HPC expert, the difficulty is coordinating SQLite
schema introspection, ordered composite keys, legacy-to-normalized data
transformation, partial retries, WAL-aware backups, rollback, and downstream
fair-share arithmetic without weakening any one guarantee. For an agent, the
challenge is first discovering those interacting contracts from unfamiliar
CLI and library code, then reproducing timing- and failure-sensitive branches,
distinguishing the intentionally broken starter from preserved behavior, and
validating a repair across hidden schemas rather than overfitting one fixture.
Local edits that move one call or add one copy still leave idempotency, schema
fidelity, usage arithmetic, or restoration wrong. The verifier therefore uses
independent schemas from a logged replayable seed plus byte-level failure
observations.
"""

[verifier]
timeout_sec = 300.0
user = "root"

[agent]
timeout_sec = 7200.0
user = "candidate"

[environment]
build_timeout_sec = 300.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
gpus = 0
allow_internet = true
mcp_servers = []
workdir = "/workspace/flux-accounting"

[environment.env]
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUNBUFFERED = "1"

[verifier.env]
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUNBUFFERED = "1"

[solution.env]
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUNBUFFERED = "1"
